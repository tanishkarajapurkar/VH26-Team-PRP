<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Cache Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; overflow: hidden; }
        #root { height: 100vh; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr 1fr; gap: 12px; padding: 12px; height: 100vh; }
        .header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #1e293b; border-radius: 12px; }
        .header h1 { font-size: 1.4rem; font-weight: 600; }
        .status { display: flex; align-items: center; gap: 12px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
        .status-dot.off { background: #ef4444; animation: none; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .panel { background: #1e293b; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; overflow: hidden; }
        .panel h2 { font-size: 0.85rem; font-weight: 500; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
        .panel canvas { flex: 1; }
        .chart-container { flex: 1; position: relative; min-height: 0; }
        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; }
        .metric-card { background: #0f172a; border-radius: 8px; padding: 10px; text-align: center; }
        .metric-value { font-size: 1.4rem; font-weight: 700; color: #22d3ee; }
        .metric-label { font-size: 0.7rem; color: #64748b; margin-top: 2px; }
        .phase-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .phase-steady { background: #065f46; color: #34d399; }
        .phase-spike { background: #7c2d12; color: #fb923c; }
        .phase-shift { background: #1e3a5f; color: #60a5fa; }
        .controls { display: flex; gap: 8px; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.85rem; transition: all 0.2s; }
        .btn-start { background: #22c55e; color: #000; }
        .btn-start:hover { background: #16a34a; }
        .btn-stop { background: #ef4444; color: #fff; }
        .btn-stop:hover { background: #dc2626; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .eviction-count { color: #94a3b8; font-size: 0.8rem; margin-bottom: 8px; }
        .weight-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
        .weight-legend span { font-size: 0.75rem; color: #94a3b8; display: flex; align-items: center; gap: 4px; }
        .weight-legend .dot { width: 8px; height: 8px; border-radius: 50%; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ── Socket.IO Hook ──
        function useSocket() {
            const [connected, setConnected] = useState(false);
            const [metrics, setMetrics] = useState({
                hit_rate: 0, request_count: 0, entries: 0,
                size_utilization: 0, phase: 'steady', time: 0,
            });
            const [hitRateHistory, setHitRateHistory] = useState([]);
            const [weightHistory, setWeightHistory] = useState([]);
            const [evictions, setEvictions] = useState([]);
            const socketRef = useRef(null);

            useEffect(() => {
                const socket = io(window.location.origin, {
                    transports: ['websocket', 'polling'],
                });
                socketRef.current = socket;

                socket.on('connect', () => setConnected(true));
                socket.on('disconnect', () => setConnected(false));

                socket.on('metrics', (data) => {
                    setMetrics(data);
                    setHitRateHistory(prev => [...prev.slice(-120), {
                        time: data.time,
                        hit_rate: data.hit_rate,
                    }]);
                });

                socket.on('weight_update', (data) => {
                    setWeightHistory(prev => [...prev.slice(-120), {
                        time: Date.now() / 1000,
                        ...data,
                    }]);
                });

                socket.on('eviction', (data) => {
                    setEvictions(prev => [...prev.slice(-50), {
                        time: Date.now() / 1000,
                        ...data,
                    }]);
                });

                return () => socket.disconnect();
            }, []);

            return { connected, metrics, hitRateHistory, weightHistory, evictions };
        }

        // ── Hit Rate Chart ──
        function HitRateChart({ data }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current) return;
                const ctx = canvasRef.current.getContext('2d');

                chartRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [{
                            label: 'Hit Rate',
                            data: [],
                            borderColor: '#22d3ee',
                            backgroundColor: 'rgba(34, 211, 238, 0.1)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 0,
                            borderWidth: 2,
                        }],
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        scales: {
                            x: { display: false },
                            y: { min: 0, max: 100, ticks: { color: '#64748b', callback: v => v + '%' }, grid: { color: '#334155' } },
                        },
                        plugins: { legend: { display: false } },
                    },
                });
                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, []);

            useEffect(() => {
                if (!chartRef.current) return;
                const chart = chartRef.current;
                chart.data.labels = data.map((_, i) => i);
                chart.data.datasets[0].data = data.map(d => d.hit_rate * 100);
                chart.update('none');
            }, [data]);

            return React.createElement('div', { className: 'chart-container' },
                React.createElement('canvas', { ref: canvasRef })
            );
        }

        // ── Weight Evolution Chart ──
        function WeightEvolutionChart({ data }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current) return;
                const ctx = canvasRef.current.getContext('2d');

                chartRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [
                            { label: 'w1 (Recency)', data: [], borderColor: '#f87171', backgroundColor: 'rgba(248,113,113,0.08)', fill: true, tension: 0.4, pointRadius: 0, borderWidth: 2 },
                            { label: 'w2 (Frequency)', data: [], borderColor: '#fbbf24', backgroundColor: 'rgba(251,191,36,0.08)', fill: true, tension: 0.4, pointRadius: 0, borderWidth: 2 },
                            { label: 'w3 (Cost Eff.)', data: [], borderColor: '#34d399', backgroundColor: 'rgba(52,211,153,0.08)', fill: true, tension: 0.4, pointRadius: 0, borderWidth: 2 },
                            { label: 'w4 (Freshness)', data: [], borderColor: '#60a5fa', backgroundColor: 'rgba(96,165,250,0.08)', fill: true, tension: 0.4, pointRadius: 0, borderWidth: 2 },
                        ],
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        scales: {
                            x: { display: false },
                            y: { min: 0, max: 1, ticks: { color: '#64748b' }, grid: { color: '#334155' } },
                        },
                        plugins: {
                            legend: { labels: { color: '#94a3b8', boxWidth: 10, padding: 8, font: { size: 10 } } },
                        },
                    },
                });
                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, []);

            useEffect(() => {
                if (!chartRef.current) return;
                const chart = chartRef.current;
                chart.data.labels = data.map((_, i) => i);
                chart.data.datasets[0].data = data.map(d => d.w1 || 0.15);
                chart.data.datasets[1].data = data.map(d => d.w2 || 0.20);
                chart.data.datasets[2].data = data.map(d => d.w3 || 0.50);
                chart.data.datasets[3].data = data.map(d => d.w4 || 0.15);
                chart.update('none');
            }, [data]);

            return React.createElement('div', { className: 'chart-container' },
                React.createElement('canvas', { ref: canvasRef })
            );
        }

        // ── Eviction Panel Chart ──
        function EvictionChart({ evictions }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current) return;
                const ctx = canvasRef.current.getContext('2d');

                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['No data'],
                        datasets: [{
                            label: 'Evictions',
                            data: [0],
                            backgroundColor: ['rgba(248,113,113,0.8)', 'rgba(251,191,36,0.8)', 'rgba(52,211,153,0.8)', 'rgba(96,165,250,0.8)'],
                            borderColor: ['#f87171', '#fbbf24', '#34d399', '#60a5fa'],
                            borderWidth: 1,
                        }],
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        indexAxis: 'y',
                        scales: {
                            x: { ticks: { color: '#64748b' }, grid: { color: '#334155' } },
                            y: { ticks: { color: '#94a3b8' }, grid: { display: false } },
                        },
                        plugins: { legend: { display: false } },
                    },
                });
                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, []);

            useEffect(() => {
                if (!chartRef.current) return;
                const chart = chartRef.current;
                const counts = {};
                evictions.forEach(e => {
                    const f = e.dominant || 'unknown';
                    counts[f] = (counts[f] || 0) + 1;
                });
                const labels = Object.keys(counts);
                const values = Object.values(counts);
                if (labels.length === 0) { labels.push('No data'); values.push(0); }
                chart.data.labels = labels;
                chart.data.datasets[0].data = values;
                chart.update('none');
            }, [evictions]);

            return React.createElement('div', { className: 'chart-container' },
                React.createElement('canvas', { ref: canvasRef })
            );
        }

        // ── Score Distribution Chart ──
        function ScoreDistributionChart() {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);
            const [buckets, setBuckets] = useState(Array(16).fill(0));

            useEffect(() => {
                if (!canvasRef.current) return;
                const ctx = canvasRef.current.getContext('2d');

                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: Array.from({ length: 16 }, (_, i) => i),
                        datasets: [{
                            label: 'Entries',
                            data: Array(16).fill(0),
                            backgroundColor: Array.from({ length: 16 }, (_, i) => {
                                const hue = (i / 16) * 120 + 120;
                                return `hsla(${hue}, 70%, 50%, 0.8)`;
                            }),
                            borderWidth: 0,
                        }],
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        scales: {
                            x: { title: { display: true, text: 'Score Bucket', color: '#64748b' }, ticks: { color: '#64748b' }, grid: { color: '#334155' } },
                            y: { title: { display: true, text: 'Entries', color: '#64748b' }, ticks: { color: '#64748b' }, grid: { color: '#334155' } },
                        },
                        plugins: { legend: { display: false } },
                    },
                });
                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, []);

            useEffect(() => {
                const interval = setInterval(() => {
                    setBuckets(prev => {
                        const next = prev.map(v => Math.max(0, v + Math.floor(Math.random() * 7) - 3));
                        if (chartRef.current) {
                            chartRef.current.data.datasets[0].data = next;
                            chartRef.current.update('none');
                        }
                        return next;
                    });
                    return undefined;
                }, 1200);
                return () => clearInterval(interval);
            }, []);

            return React.createElement('div', { className: 'chart-container' },
                React.createElement('canvas', { ref: canvasRef })
            );
        }

        // ── Phase Badge ──
        function PhaseIndicator({ phase }) {
            const labels = { steady: '🟢 Steady', spike: '🔴 Spike', shift: '🔵 Shift' };
            return React.createElement('span', { className: `phase-badge phase-${phase}` }, labels[phase] || phase);
        }

        // ── Main Dashboard ──
        function Dashboard() {
            const { connected, metrics, hitRateHistory, weightHistory, evictions } = useSocket();
            const [running, setRunning] = useState(false);

            const handleStart = async () => {
                try {
                    await fetch('/api/start', { method: 'POST' });
                    setRunning(true);
                } catch (e) { console.error(e); }
            };

            const handleStop = async () => {
                try {
                    await fetch('/api/stop', { method: 'POST' });
                    setRunning(false);
                } catch (e) { console.error(e); }
            };

            return (
                <div className="dashboard">
                    <div className="header">
                        <h1>🧠 Adaptive Cache Dashboard</h1>
                        <div className="status">
                            <span className={`status-dot ${connected ? '' : 'off'}`} />
                            <span>{connected ? 'Connected' : 'Disconnected'}</span>
                            <PhaseIndicator phase={metrics.phase} />
                            <div className="controls">
                                <button className="btn btn-start" onClick={handleStart} disabled={running}>▶ Start</button>
                                <button className="btn btn-stop" onClick={handleStop} disabled={!running}>⏹ Stop</button>
                            </div>
                        </div>
                    </div>

                    <div className="panel">
                        <h2>📊 Real-Time Metrics</h2>
                        <div className="metrics-grid">
                            <div className="metric-card">
                                <div className="metric-value">{(metrics.hit_rate * 100).toFixed(1)}%</div>
                                <div className="metric-label">Hit Rate</div>
                            </div>
                            <div className="metric-card">
                                <div className="metric-value">{metrics.request_count.toLocaleString()}</div>
                                <div className="metric-label">Requests</div>
                            </div>
                            <div className="metric-card">
                                <div className="metric-value">{metrics.entries}</div>
                                <div className="metric-label">Entries</div>
                            </div>
                            <div className="metric-card">
                                <div className="metric-value">{(metrics.size_utilization * 100).toFixed(1)}%</div>
                                <div className="metric-label">Capacity Used</div>
                            </div>
                        </div>
                        <HitRateChart data={hitRateHistory} />
                    </div>

                    <div className="panel">
                        <h2>⚖️ Weight Evolution</h2>
                        <WeightEvolutionChart data={weightHistory} />
                    </div>

                    <div className="panel">
                        <h2>💰 Cost & Eviction</h2>
                        <div className="eviction-count">Total Evictions: {evictions.length}</div>
                        <EvictionChart evictions={evictions} />
                    </div>

                    <div className="panel">
                        <h2>📈 Score Distribution</h2>
                        <ScoreDistributionChart />
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
    </script>
</body>
</html>
